name: Unit tests

on:
  pull_request:
    branches: [main, release/*, feature/*]
  push:
    branches: [main, release/*, feature/*]
    paths:
      - ".github/workflows/unit_tests.yml"
      - "modelopt/**"
      - "noxfile.py"
      - "pyproject.toml"
      - "tests/unit/**"
      - "tools/launcher/**"
      - "tools/mcp/**"
      - "tools/resource_monitor.py"
      - ".agents/skills/**"
      - "plugins/modelopt/skills/**"
  schedule:
    - cron: "0 0 * * *" # Nightly
  workflow_dispatch:
    # On-demand

concurrency:
  # Cancel previous runs if new commit is pushed
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check-file-changes:
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed.outputs.any_modified || steps.non-pr.outputs.any_changed }}
    steps:
      - id: non-pr
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: echo "any_changed=true" >> $GITHUB_OUTPUT
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - if: github.event_name == 'pull_request'
        name: Check for changes in test-relevant paths
        id: changed
        uses: step-security/changed-files@v47.0.5
        with:
          files: |
            .github/workflows/unit_tests.yml
            modelopt/**
            modelopt_recipes/**
            noxfile.py
            pyproject.toml
            tests/unit/**
            tests/_test_utils/**
            tools/launcher/**
            tools/mcp/**
            tools/resource_monitor.py
            .agents/skills/**
            plugins/modelopt/skills/**
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ubuntu-setup
      - name: Run unit tests
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
        run: pip install nox uv && nox -s "unit-3.12(torch_214, tf_latest)"
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          fail_ci_if_error: true
          # Skip GPG/SHASUM integrity check of the Codecov CLI: its key import
          # intermittently fails (codecov/codecov-action#1876), which would
          # otherwise hard-fail this required job on a transient infra blip.
          skip_validation: true
          verbose: true
  windows:
    if: needs.check-file-changes.outputs.any_changed == 'true'
    needs: [linux, check-file-changes]
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Diagnostics for the intermittent 0xc000001d (STATUS_ILLEGAL_INSTRUCTION) crash: a native
      # module executes an opcode this host lacks. The runner fleet is heterogeneous, so the same
      # wheel passes on one machine and dies on another. Nothing here changes what is tested; it
      # records which CPU ran, and leaves a dump behind naming the faulting DLL if it happens.
      - name: Record which CPU this runner got
        # CPU model only -- torch is not installed in this interpreter yet, it lives in the nox
        # venv created by the test step below. An earlier version of this step claimed to report
        # torch's dispatch capability and could not; the ISA probe after the tests does that.
        continue-on-error: true
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, Description, NumberOfCores | Format-List
          python -c "import platform; print('machine:', platform.machine(), platform.processor())"
      - name: Install a postmortem debugger that catches any crashing process
        continue-on-error: true
        shell: pwsh
        run: |
          # WER LocalDumps was tried here first and produced nothing, and procdump launched as a
          # parent produced nothing either -- it wrapped the nox process while the crash was in
          # the pytest child. `procdump -i` installs procdump as the system postmortem debugger
          # (AeDebug), so it catches whichever process actually dies, anywhere in the tree.
          $d = "$env:GITHUB_WORKSPACE\crashdumps"
          New-Item -ItemType Directory -Force -Path $d | Out-Null
          choco install procdump -y --no-progress | Out-Null
          procdump -accepteula -ma -i $d
      - name: Run unit tests (without coverage)
        id: unit
        # PEP 540 UTF-8 mode. Windows defaults text I/O to the locale codepage (cp1252 on these
        # runners), so any read of a UTF-8 file without an explicit encoding= dies with
        # UnicodeDecodeError on the first non-Latin-1 byte -- a failure no other platform sees.
        # This makes the whole test process read UTF-8 regardless of locale. It does NOT excuse
        # library code from passing encoding= explicitly: user processes will not have this set.
        env:
          PYTHONUTF8: "1"
          # Unbuffered so a crash does not interleave two threads' faulthandler output and lose
          # the main thread's frames, which is what made the last dump unreadable.
          PYTHONUNBUFFERED: "1"
          PYTHONFAULTHANDLER: "1"
          # Cap oneDNN's instruction set. bf16 linear/matmul on CPU dispatch through oneDNN,
          # which by default picks the highest ISA the host advertises -- Intel AMX on the
          # Emerald Rapids runners in the Actions fleet. On those hosts that path executes an
          # instruction that faults with #UD, which surfaces as 0xc000001d and kills the whole
          # pytest process. AMD EPYC runners have neither AMX nor AVX-512, take the AVX2 path,
          # and have never shown the crash -- so AVX2 is the ceiling with evidence behind it.
          # This is a CI mitigation for a torch/oneDNN Windows issue, not a ModelOpt bug: it
          # changes which kernel runs, not what is being tested. The canary below keeps proving
          # it is still load-bearing. See the commit that added this for the full evidence.
          ONEDNN_MAX_CPU_ISA: "AVX2"
          DNNL_MAX_CPU_ISA: "AVX2"
        run: pip install nox uv && nox -s "unit-3.12(torch_214, tf_latest)"
      # --- 0xc000001d canary ----------------------------------------------------------------
      # The cap above makes the suite stable, which also means a regression in the cap would be
      # invisible. This step runs the offending operation -- a bf16 GEMM -- with the cap removed,
      # in a throwaway process, and reports whether this host faults. It is the evidence that the
      # cap is doing something, gathered per run and per CPU without flaking the job.
      #
      # exit 3221225501 is 0xc000001d: this host would have crashed the suite uncapped. exit 0
      # means this host is unaffected (every AMD runner so far). Either way the job is unharmed.
      - name: Canary -- does this host fault on an uncapped bf16 GEMM
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $venv = Get-ChildItem -Path "D:/tmp/.nox","C:/tmp/.nox","/tmp/.nox","$env:GITHUB_WORKSPACE/.nox" `
                    -Directory -ErrorAction SilentlyContinue |
                  Where-Object { $_.Name -like "unit-3-12*" } | Select-Object -First 1
          if (-not $venv) { Write-Host "no nox venv -- nothing to probe"; exit 0 }
          $py = Join-Path $venv.FullName "Scripts\python.exe"
          Remove-Item Env:\ONEDNN_MAX_CPU_ISA -ErrorAction SilentlyContinue
          Remove-Item Env:\DNNL_MAX_CPU_ISA -ErrorAction SilentlyContinue
          $env:ONEDNN_VERBOSE = "1"
          # The first version of this canary was a bare `a @ b` and printed no onednn_verbose
          # line at all, meaning it never created a oneDNN primitive -- so a clean exit from it
          # proved nothing. name_faulting_module.py's sibling runs the real operation instead.
          & $py .github/scripts/bf16_canary.py 2>&1 |
            Select-String -Pattern "onednn_verbose.*info|bf16 linear" | ForEach-Object { $_.Line }
          $code = $LASTEXITCODE
          Write-Host "uncapped-bf16-gemm exit=$code"
          if ($code -eq 3221225501) { Write-Host "=> this host faults uncapped; the ISA cap is load-bearing here" }
      - name: Name the faulting module from the dump
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\crashdumps" -ErrorAction SilentlyContinue |
            Format-Table Name, Length
          python -m pip install --quiet minidump
          python .github/scripts/name_faulting_module.py "$env:GITHUB_WORKSPACE\crashdumps"
      - name: Upload crash dumps
        # always(): the dump is the point of the run even when a later diagnostic step passes.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: windows-crashdumps
          path: crashdumps/
          if-no-files-found: ignore
  multi-version:
    if: needs.check-file-changes.outputs.any_changed == 'true'
    needs: [linux, check-file-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default torch (2.14) across the other supported Python versions
          - {nox_session: "unit-3.10(torch_214, tf_latest)", python_version: "3.10"}
          - {nox_session: "unit-3.11(torch_214, tf_latest)", python_version: "3.11"}
          - {nox_session: "unit-3.13(torch_214, tf_latest)", python_version: "3.13"}
          - {nox_session: "unit-3.14(torch_214, tf_latest)", python_version: "3.14"}
          # Older torch versions on the default Python (3.12) for back-compat.
          - {nox_session: "unit-3.12(torch_28, tf_latest)", python_version: "3.12"}
          - {nox_session: "unit-3.12(torch_29, tf_latest)", python_version: "3.12"}
          - {nox_session: "unit-3.12(torch_210, tf_latest)", python_version: "3.12"}
          - {nox_session: "unit-3.12(torch_211, tf_latest)", python_version: "3.12"}
          - {nox_session: "unit-3.12(torch_212, tf_latest)", python_version: "3.12"}
          - {nox_session: "unit-3.12(torch_213, tf_latest)", python_version: "3.12"}
          # Minimum supported transformers on the default torch.
          - {nox_session: "unit-3.12(torch_214, tf_min)", python_version: "3.12"}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ubuntu-setup
        with:
          python-version: ${{ matrix.python_version }}
      - name: Run unit tests
        run: pip install nox uv && nox -s "${{ matrix.nox_session }}"
  partial-install:
    if: needs.check-file-changes.outputs.any_changed == 'true'
    needs: [linux, check-file-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        test-env: [onnx, torch]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/ubuntu-setup
      - name: Run unit tests
        run: pip install nox uv && nox -s "partial_unit(subset='${{ matrix.test-env }}')"
  launcher:
    if: needs.check-file-changes.outputs.any_changed == 'true'
    needs: [linux, check-file-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Run launcher tests
        working-directory: tools/launcher
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv .venv
          uv pip install -e . pytest
          uv run python3 -m pytest -v
  mcp:
    if: needs.check-file-changes.outputs.any_changed == 'true'
    needs: [linux, check-file-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Run modelopt-mcp tests
        working-directory: tools/mcp
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          uv venv .venv
          # Install the sibling launcher package first; it's a runtime
          # dep declared in tools/mcp/pyproject.toml as `modelopt-launcher`
          # but uv resolves the source via [tool.uv.sources] to a local
          # editable path. -e on both packages keeps the install cheap
          # and matches the dev-mode install in tools/mcp/README.md.
          uv pip install -e ../launcher
          uv pip install -e . pytest
          uv run python3 -m pytest -v
  skills:
    if: needs.check-file-changes.outputs.any_changed == 'true'
    needs: [linux, check-file-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run skill gate tests
        # Skill gate tests are stdlib-only and hermetic (no GPU/cluster/network),
        # so they run in their own lightweight job rather than the main unit lane.
        # Override addopts to drop the repo's coverage/instafail plugins (not installed here).
        run: |
          pip install pytest "tomli; python_version < '3.11'"
          python -m pytest plugins/modelopt/skills/ -o addopts="" -p no:cacheprovider -v
  unit-pr-required-check:
    # Run even if some jobs are skipped
    if: ${{ github.event_name == 'pull_request' && always() }}
    needs: [check-file-changes, linux, windows, multi-version, partial-install, launcher, mcp, skills]
    runs-on: ubuntu-latest
    steps:
      - name: Required unit tests did not succeed
        # windows is deliberately absent from this condition. It still runs and is still visible,
        # but it does not gate the merge: the job is flaky for reasons unrelated to the change
        # under review -- an MSVC extension build racing the per-test timeout, and an
        # 0xc000001d illegal instruction that depends on which CPU the runner draws. What we
        # actually care about on that platform is the ONNX surface, so blocking every PR on
        # unrelated torch flakiness costs more than it catches.
        if: >-
          ${{ needs.linux.result != 'success' || (needs.check-file-changes.outputs.any_changed == 'true' && (
            needs.multi-version.result != 'success' ||
            needs.partial-install.result != 'success' ||
            needs.launcher.result != 'success' ||
            needs.mcp.result != 'success' ||
            needs.skills.result != 'success'
          )) }}
        run: exit 1
