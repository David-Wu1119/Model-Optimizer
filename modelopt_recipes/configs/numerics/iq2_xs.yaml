# IQ2_XS weight quantizer using the built-in GGML IQ auto search.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerAttributeConfig
num_bits: iq2_xs
effective_bits: 2.3125
block_sizes:
  -1: 256
backend: ggml
backend_extra_args:
  search_impl: auto
