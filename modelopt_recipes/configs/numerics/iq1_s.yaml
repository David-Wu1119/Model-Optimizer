# IQ1_S weight quantizer using the built-in GGML IQ auto search.

# modelopt-schema: modelopt.torch.quantization.config.QuantizerAttributeConfig
num_bits: iq1_s
effective_bits: 1.5625
block_sizes:
  -1: 256
backend: ggml
backend_extra_args:
  search_impl: auto
pass_through_bwd: true
